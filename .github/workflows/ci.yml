name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate control plane
        run: |
          python3 -m unittest discover -s tests -v
          ./toolctl validate
      - name: Emit tool matrix
        id: matrix
        run: echo "value=$(./toolctl matrix --json)" >> "$GITHUB_OUTPUT"

  verify:
    needs: catalog
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify ${{ matrix.tool }} on ${{ matrix.platform }}
        run: ./toolctl verify --tool "${{ matrix.tool }}" --platform "${{ matrix.platform }}"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ matrix.tool }}-${{ matrix.platform }}
          path: .artifacts/
          if-no-files-found: ignore
          retention-days: 14
