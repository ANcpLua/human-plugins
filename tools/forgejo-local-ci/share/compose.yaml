name: forgejo-local-ci

networks:
  forgejo:

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15@sha256:55bb42bec9abef5223744804f164e37d37b20df7e8b8b4807ba213ad4f071d6d
    container_name: forgejo-local-ci
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__database__PATH: /data/gitea/gitea.db
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__ROOT_URL: http://localhost:3000/
      FORGEJO__server__START_SSH_SERVER: "false"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
    networks: [forgejo]
    volumes:
      - ${FORGEJO_LOCAL_STATE}/forgejo:/data
      - ${FORGEJO_LOCAL_STATE}/secrets:/local-ci-secrets:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  docker-in-docker:
    image: docker:dind@sha256:66d292e5c26bd33a6f6f61cacb880de2186339a524ecba1ce098dbbaceed6515
    container_name: forgejo-local-ci-dind
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    privileged: true
    networks: [forgejo]
    restart: unless-stopped

  runner:
    image: data.forgejo.org/forgejo/runner:12@sha256:268ad0d1d24bd7ecf2386b7c44e8211398dc014ca81d4fd5fbad96fe79af18f5
    container_name: forgejo-local-ci-runner
    profiles: [runner]
    depends_on:
      docker-in-docker:
        condition: service_started
      forgejo:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2375
    networks: [forgejo]
    user: "1000:1000"
    volumes:
      - ${FORGEJO_LOCAL_STATE}/runner:/data
    command: forgejo-runner daemon --config /data/runner-config.yml
    restart: unless-stopped
